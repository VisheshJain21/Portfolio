<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171c27"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#g)"/>
  <!-- Static echo of the audit-trail WebGL motif (motif 2): log-lines of
       varying length plus one highlighted scan row. -->
  <g stroke-linecap="round">
    <line x1="24" y1="40" x2="210" y2="40" stroke="#ff6a2b" stroke-opacity="0.4" stroke-width="3"/>
    <line x1="24" y1="72" x2="320" y2="72" stroke="#ff6a2b" stroke-opacity="0.35" stroke-width="3"/>
    <line x1="24" y1="104" x2="150" y2="104" stroke="#ff6a2b" stroke-opacity="0.4" stroke-width="3"/>
    <line x1="24" y1="136" x2="270" y2="136" stroke="#ff8b57" stroke-opacity="0.75" stroke-width="3"/>
    <line x1="24" y1="168" x2="190" y2="168" stroke="#ff6a2b" stroke-opacity="0.35" stroke-width="3"/>
    <line x1="24" y1="200" x2="300" y2="200" stroke="#ff6a2b" stroke-opacity="0.4" stroke-width="3"/>
  </g>
  <text x="24" y="270" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2" fill="#9aa2b0">NEXUS</text>
</svg>
